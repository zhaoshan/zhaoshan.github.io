<!DOCTYPE html>
<html lang="zh-CN" data-theme="gold">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#0a1628">
<title>议程浏览</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
:root,[data-theme="gold"]{--primary:#0a1628;--primary-light:#1a2744;--primary-lighter:#2a3a5c;--accent:#c9a96e;--accent-light:#e8d5a8;--accent-rgb:201,169,110;--gold:#d4af37;--bg:#f5f0e8;--card-bg:#fff;--text:#1a1a2e;--text-light:#666;--border:#e0d8c8}
[data-theme="blue"]{--primary:#0a1a3d;--primary-light:#0d2d5e;--primary-lighter:#1565b8;--accent:#006eff;--accent-light:#4d9eff;--accent-rgb:0,110,255;--gold:#3b9eff;--bg:#f0f5ff;--card-bg:#fff;--text:#1a1a2e;--text-light:#5a6a8a;--border:#d0e0f5}
[data-theme="ocean"]{--primary:#0a192f;--primary-light:#132f4c;--primary-lighter:#1e3a5f;--accent:#00b4d8;--accent-light:#90e0ef;--accent-rgb:0,180,216;--gold:#48cae4;--bg:#f0f4f8;--card-bg:#fff;--text:#1a1a2e;--text-light:#555;--border:#d0dde8}
[data-theme="emerald"]{--primary:#0a1a14;--primary-light:#1a3328;--primary-lighter:#2a4a3a;--accent:#34d399;--accent-light:#a7f3d0;--accent-rgb:52,211,153;--gold:#6ee7b7;--bg:#f0f7f4;--card-bg:#fff;--text:#1a1a2e;--text-light:#555;--border:#d0e8dc}
[data-theme="rose"]{--primary:#1a0f14;--primary-light:#33202a;--primary-lighter:#4a303a;--accent:#e8a0a0;--accent-light:#f5d0d0;--accent-rgb:232,160,160;--gold:#f0b8b8;--bg:#f7f0f0;--card-bg:#fff;--text:#1a1a2e;--text-light:#666;--border:#e8d0d0}
[data-theme="sunset"]{--primary:#1a100a;--primary-light:#33281a;--primary-lighter:#4a3a2a;--accent:#ff8c42;--accent-light:#ffd4a0;--accent-rgb:255,140,66;--gold:#ffb07a;--bg:#f7f2f0;--card-bg:#fff;--text:#1a1a2e;--text-light:#666;--border:#e8d8d0}
[data-theme="purple"]{--primary:#1a0a2e;--primary-light:#2d1b4e;--primary-lighter:#3d2b6e;--accent:#c9a9e8;--accent-light:#e8d9f5;--accent-rgb:201,169,232;--gold:#b388ff;--bg:#f3f0f7;--card-bg:#fff;--text:#1a1a2e;--text-light:#666;--border:#ddd6e8}
[data-theme="teal"]{--primary:#0a1a1a;--primary-light:#0f2f2f;--primary-lighter:#144040;--accent:#20c9b0;--accent-light:#8ef5e2;--accent-rgb:32,201,176;--gold:#2ee6cc;--bg:#eef5f3;--card-bg:#fff;--text:#1a1a2e;--text-light:#555;--border:#cce8e2}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Inter','Noto Sans SC',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
.hero{position:relative;overflow:hidden;color:var(--hero-title-text,#fff);padding:64px 24px 56px;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 40%,var(--primary-lighter) 100%)}
.hero.has-cover{background-size:cover;background-position:center;background-blend-mode:multiply}
.hero::before{content:'';position:absolute;top:-40%;right:-25%;width:520px;height:520px;background:radial-gradient(circle,rgba(var(--accent-rgb),.16) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-35%;left:-15%;width:380px;height:380px;background:radial-gradient(circle,rgba(var(--accent-rgb),.1) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.hero-inner{position:relative;z-index:1;max-width:760px;margin:0 auto}
.hero-logo{height:46px;margin-bottom:22px;display:flex;align-items:center}
.hero-logo img{max-height:46px;max-width:200px;width:auto}
.hero-badge{display:inline-block;background:var(--hero-accent-bg,rgba(var(--accent-rgb),.16));border:1px solid rgba(var(--accent-rgb),.35);color:var(--hero-accent-text,var(--accent));font-size:10px;letter-spacing:3px;text-transform:uppercase;padding:6px 16px;border-radius:20px;margin-bottom:22px;font-weight:600}
.hero h1{font-size:34px;font-weight:800;line-height:1.18;margin-bottom:10px;letter-spacing:-.5px;color:var(--hero-title-text,#fff)}
.hero-sub{font-size:15px;color:var(--hero-sub-text,rgba(255,255,255,.62));font-weight:300;margin-bottom:30px}
.hero-meta{display:flex;gap:10px;flex-wrap:wrap}
.meta-chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;backdrop-filter:blur(6px)}
.meta-chip .lbl{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.4);display:block;margin-bottom:3px}
.meta-chip .val{font-size:13px;font-weight:600;color:var(--hero-accent-text,var(--accent-light))}
.golden-line{height:3px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent))}
.day-nav{position:sticky;top:0;z-index:50;background:var(--nav-bg,rgba(255,255,255,.92));backdrop-filter:blur(12px);border-bottom:1px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,.04)}
.day-nav-inner{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.day-nav-inner::-webkit-scrollbar{display:none}
.day-chip{flex-shrink:0;padding:7px 16px;border-radius:20px;background:var(--nav-chip-bg,var(--bg));border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--nav-chip-text,var(--text-light));cursor:pointer;transition:.2s;white-space:nowrap;text-decoration:none}
.day-chip:hover{border-color:var(--accent);color:var(--accent)}
.day-chip.active{background:var(--nav-chip-active-bg,var(--primary));color:var(--nav-chip-active-text,#fff);border-color:var(--nav-chip-active-bg,var(--primary))}
.days{max-width:820px;margin:0 auto;padding:40px 18px}
.day-block{margin-bottom:48px;scroll-margin-top:64px}
.day-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:24px}
.day-num{flex-shrink:0;width:38px;height:38px;border-radius:50%;background:var(--tl-day-num-bg,var(--primary));color:var(--tl-day-num-text,#fff);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(10,22,40,.2)}
.day-info .day-title{font-size:18px;font-weight:700;color:var(--tl-day-title-text,var(--primary));line-height:1.3}
.day-info .day-sub{font-size:12px;color:var(--text-light);margin-top:3px}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--accent),var(--gold),var(--accent))}
.tl-item{position:relative;background:var(--card-bg);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.05);border-left:3px solid var(--accent);transition:.2s}
.tl-item:hover{transform:translateX(3px);box-shadow:0 6px 20px rgba(0,0,0,.09)}
.tl-item.break{border-left-color:var(--tl-gold,var(--gold));background:linear-gradient(135deg,var(--card-bg),rgba(var(--accent-rgb),.05))}
.tl-dot{position:absolute;left:-22px;top:20px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--card-bg);box-shadow:0 0 0 2px var(--accent)}
.tl-item.break .tl-dot{background:var(--tl-gold,var(--gold));box-shadow:0 0 0 2px var(--tl-gold,var(--gold))}
.tl-time{display:inline-block;background:var(--tl-time-bg,rgba(var(--accent-rgb),.12));color:var(--tl-time-text,var(--accent));font-size:11px;font-weight:700;padding:3px 11px;border-radius:16px;margin-bottom:8px;letter-spacing:.3px}
.tl-item.break .tl-time{background:rgba(212,175,55,.15);color:var(--tl-gold,var(--gold))}
.tl-title{font-size:15px;font-weight:700;color:var(--tl-title-text,var(--primary));margin-bottom:4px}
.tl-pres{font-size:12px;color:var(--tl-pres-text,var(--text-light));font-style:italic;margin-bottom:8px}
.tl-bullets{list-style:none;padding:0}
.tl-bullets li{font-size:13px;color:var(--tl-pres-text,var(--text-light));padding-left:16px;position:relative;margin-bottom:4px}
.tl-bullets li::before{content:'';position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.attendees{background:linear-gradient(135deg,var(--att-section-bg,var(--primary)) 0%,var(--primary-light) 100%);color:var(--att-section-title,#fff);padding:48px 18px}
.attendees-inner{max-width:820px;margin:0 auto}
.sec-title{font-size:22px;font-weight:800;margin-bottom:6px}
.attendees .sec-title{color:var(--att-section-title,#fff)}
.sec-sub{font-size:13px;color:var(--text-light);margin-bottom:28px}
.attendees .sec-sub{color:rgba(255,255,255,.5)}
.party{background:rgba(255,255,255,.06);border-radius:16px;padding:20px 22px;margin-bottom:20px;border-left:4px solid var(--att-accent-bg,var(--accent))}
.party[data-c="2"]{border-left-color:#6366f1}
.party[data-c="3"]{border-left-color:#ec4899}
.party[data-c="4"]{border-left-color:#f59e0b}
.party-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.party-badge{background:var(--att-accent-bg,rgba(var(--accent-rgb),.16));border:1px solid rgba(var(--accent-rgb),.35);color:var(--att-accent-text,var(--accent));font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:4px 12px;border-radius:16px;font-weight:700}
.party-name{font-size:16px;font-weight:700;color:var(--att-name-text,#fff)}
.party-count{margin-left:auto;font-size:12px;color:rgba(255,255,255,.45)}
.att-list{display:grid;grid-template-columns:1fr;gap:8px}
.att-card{background:rgba(255,255,255,.04);border-radius:10px;padding:11px 14px;border:1px solid rgba(255,255,255,.05)}
.att-card .an{font-size:14px;font-weight:600;color:var(--att-name-text,#fff);margin-bottom:2px}
.att-card .ar{font-size:12px;color:var(--att-role-text,rgba(255,255,255,.55))}
.att-card .ad{display:inline-block;font-size:10px;font-weight:700;background:var(--att-accent-bg,rgba(var(--accent-rgb),.18));color:var(--att-accent-text,var(--accent));padding:2px 8px;border-radius:8px;margin-top:5px;letter-spacing:.5px}
@media(min-width:640px){.att-list{grid-template-columns:1fr 1fr}}
.legend{max-width:820px;margin:0 auto;padding:36px 18px 24px}
.legend-grid{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.legend-item{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--text-light);background:rgba(var(--accent-rgb),.06);border:1px solid rgba(var(--accent-rgb),.16);border-radius:10px;padding:7px 14px}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.footer{text-align:center;padding:30px 18px;background:var(--primary);color:rgba(255,255,255,.4);font-size:11px;letter-spacing:1px}
.fab{position:fixed;right:18px;bottom:24px;z-index:80;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--fab-start,var(--accent)),var(--fab-end,var(--gold)));color:var(--fab-text,#0a1628);border:none;font-size:22px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;transition:.2s}
.fab:hover{transform:translateY(-2px) scale(1.05)}
.fab:active{transform:scale(.95)}
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none;align-items:flex-end;justify-content:center}
.sheet-mask.open{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:28px 24px 32px;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-close{position:absolute;top:14px;right:18px;background:none;border:none;font-size:24px;color:#999;cursor:pointer}
.sheet-title{font-size:18px;font-weight:800;color:#1a1a2e;margin-bottom:4px}
.sheet-desc{font-size:13px;color:#888;margin-bottom:20px}
.qr-box{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;margin:0 auto 18px;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.qr-box canvas,.qr-box img{width:100%;height:100%;object-fit:contain}
.share-url{display:flex;gap:8px;margin-bottom:14px}
.share-url input{flex:1;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-size:12px;color:#444;background:#fafafa;min-width:0}
.btn{padding:11px 18px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s}
.btn-primary{background:var(--accent);color:#0a1628}
.btn-primary:hover{opacity:.88}
.btn-outline{background:#f0f0f0;color:#333;border:1px solid #ddd}
.btn-outline:hover{background:#e8e8e8}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}
.copied{font-size:12px;color:#10b981;font-weight:600;text-align:center;height:16px;margin-top:6px}
@media(min-width:768px){.hero{padding:80px 40px 70px}.hero h1{font-size:42px}.hero-sub{font-size:16px}.hero-meta{gap:12px}.meta-chip{padding:12px 18px}.meta-chip .val{font-size:14px}.days,.attendees-inner,.legend{max-width:820px}.day-info .day-title{font-size:22px}.tl-title{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" id="fab" aria-label="分享">🔗</button>
<div class="sheet-mask" id="sheetMask">
  <div class="sheet">
    <button class="sheet-close" id="sheetClose">×</button>
    <div class="sheet-title">分享议程</div>
    <div class="sheet-desc">扫描二维码或复制链接，在手机上查看完整日程</div>
    <div class="qr-box"><canvas id="qrCanvas"></canvas></div>
    <div class="share-url">
      <input id="shareInput" readonly value="">
      <button class="btn btn-primary" id="copyLink">复制</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline" id="dlImg">📷 保存日程图</button>
      <button class="btn btn-outline" id="copyAll">📋 复制文字</button>
    </div>
    <div class="copied" id="copied"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="assets/app.js"></script>
<script>
const BREAK_KEYWORDS = ['coffee break','lunch','welcome dinner','group dinner','dinner','break'];
function isBreak(title){
  const t=(title||'').toLowerCase();
  return BREAK_KEYWORDS.some(k=>t.includes(k));
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function init(){
  const data = await AgendaApp.getData();
  const s = data.settings||{}, h = data.hero||{};
  AgendaApp.applyTheme(s);
  document.title = (h.title||'议程') + ' · ' + (h.subtitle||'');
  const shareUrl = window.location.href;

  let html = '';
  // Hero
  html += '<section class="hero'+(s.cover_url?' has-cover':'')+'"'+(s.cover_url?(' style="background-image:url(\''+s.cover_url+'\')"'):'')+'>';
  html += '<div class="hero-inner">';
  html += '<div class="hero-logo">'+(s.logo_url?'<img src="'+esc(s.logo_url)+'" alt="logo">':'')+'</div>';
  html += '<div class="hero-badge">'+esc(h.badge)+'</div>';
  html += '<h1>'+esc(h.title)+'</h1>';
  html += '<p class="hero-sub">'+esc(h.subtitle)+'</p>';
  html += '<div class="hero-meta">';
  (h.meta||[]).forEach(m=>{
    html += '<div class="meta-chip"><span class="lbl">'+esc(m.label)+'</span><span class="val">'+esc(m.value)+'</span></div>';
  });
  html += '</div></div></section>';
  html += '<div class="golden-line"></div>';

  // Day nav
  if(data.days && data.days.length){
    html += '<nav class="day-nav"><div class="day-nav-inner">';
    data.days.forEach((d,i)=>{
      let label = d.title.split('–')[0].trim();
      if(!label || label===d.title) label = d.title.split(' ').slice(0,2).join(' ');
      html += '<a class="day-chip" data-idx="'+i+'" href="#day-'+i+'">'+esc(label)+'</a>';
    });
    html += '</div></nav>';
  }

  // Days
  html += '<main class="days">';
  (data.days||[]).forEach((d,i)=>{
    html += '<section class="day-block" id="day-'+i+'">';
    html += '<div class="day-header"><div class="day-num">'+(i+1)+'</div><div class="day-info">';
    html += '<div class="day-title">'+esc(d.title)+'</div>';
    if(d.subtitle) html += '<div class="day-sub">'+esc(d.subtitle)+'</div>';
    html += '</div></div><div class="timeline">';
    (d.items||[]).forEach(it=>{
      const brk = isBreak(it.title);
      html += '<div class="tl-item'+(brk?' break':'')+'"><div class="tl-dot"></div>';
      if(it.time) html += '<div class="tl-time">'+esc(it.time)+'</div>';
      html += '<div class="tl-title">'+esc(it.title)+'</div>';
      if(it.presenter) html += '<div class="tl-pres">'+esc(it.presenter)+'</div>';
      if(it.bullets && it.bullets.length){
        html += '<ul class="tl-bullets">';
        it.bullets.forEach(b=>{ if(b && b.trim()) html += '<li>'+esc(b)+'</li>'; });
        html += '</ul>';
      }
      html += '</div>';
    });
    html += '</div></section>';
  });
  html += '</main><div class="golden-line"></div>';

  // Attendees
  if(data.parties && data.parties.length){
    html += '<section class="attendees"><div class="attendees-inner">';
    html += '<h2 class="sec-title">参会人员</h2><p class="sec-sub">Attendees</p>';
    data.parties.forEach((p,idx)=>{
      html += '<div class="party" data-c="'+((idx%5)+1)+'">';
      html += '<div class="party-head"><span class="party-badge">'+esc(p.role)+'</span><span class="party-name">'+esc(p.name)+'</span><span class="party-count">'+(p.attendees||[]).length+' 人</span></div>';
      html += '<div class="att-list">';
      (p.attendees||[]).forEach(a=>{
        html += '<div class="att-card"><div class="an">'+esc(a.name)+'</div><div class="ar">'+esc(a.role)+'</div>';
        if(a.dept && a.dept!=='-') html += '<span class="ad">'+esc(a.dept)+'</span>';
        html += '</div>';
      });
      html += '</div></div>';
    });
    html += '</div></section><div class="golden-line"></div>';
  }

  // Legend
  if(data.legends && data.legends.length){
    const colors=['rgb(201,169,110)','#6366f1','#2ca004','#ec4899','#f59e0b','#10b981'];
    html += '<section class="legend"><h2 class="sec-title">图例</h2><p class="sec-sub">Legend · 文中使用的缩写说明</p>';
    html += '<div class="legend-grid">';
    data.legends.forEach((l,i)=>{
      html += '<div class="legend-item"><div class="legend-dot" style="background:'+colors[i%colors.length]+'"></div><span>'+esc(l)+'</span></div>';
    });
    html += '</div></section>';
  }

  // Footer
  html += '<div class="footer">'+esc(data.footer)+'</div>';
  document.getElementById('app').innerHTML = html;

  // Day nav active state
  const chips=[...document.querySelectorAll('.day-chip')];
  const blocks=[...document.querySelectorAll('.day-block')];
  chips.forEach(c=>c.addEventListener('click',()=>{chips.forEach(x=>x.classList.remove('active'));c.classList.add('active');}));
  if('IntersectionObserver' in window){
    const obs=new IntersectionObserver(es=>{es.forEach(e=>{
      if(e.isIntersecting){const i=e.target.id.split('-')[1];chips.forEach(x=>x.classList.toggle('active',x.dataset.idx===i));}
    });},{rootMargin:'-80px 0px -70% 0px'});
    blocks.forEach(b=>obs.observe(b));
  }
  if(chips[0])chips[0].classList.add('active');

  // Share sheet
  const mask=document.getElementById('sheetMask');
  document.getElementById('fab').addEventListener('click',()=>{
    mask.classList.add('open');
    document.getElementById('shareInput').value=shareUrl;
    // generate QR
    if(typeof QRCode!=='undefined'){
      QRCode.toCanvas(document.getElementById('qrCanvas'),shareUrl,{width:168,margin:1,color:{dark:'#0a1628',light:'#ffffff'}},function(err){if(err)console.error(err);});
    }
  });
  document.getElementById('sheetClose').addEventListener('click',()=>mask.classList.remove('open'));
  mask.addEventListener('click',e=>{if(e.target===mask)mask.classList.remove('open');});

  function flash(msg){const c=document.getElementById('copied');c.textContent=msg;setTimeout(()=>c.textContent='',1800);}
  document.getElementById('copyLink').addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText(shareUrl);flash('✅ 链接已复制');}
    catch(e){const inp=document.getElementById('shareInput');inp.select();document.execCommand('copy');flash('✅ 链接已复制');}
  });
  document.getElementById('copyAll').addEventListener('click',async()=>{
    let t=document.title+'\n'+shareUrl+'\n\n';
    document.querySelectorAll('.day-block').forEach(d=>{
      t+='\n'+d.querySelector('.day-title').textContent+'\n';
      d.querySelectorAll('.tl-item').forEach(it=>{
        const time=it.querySelector('.tl-time')?.textContent||'';
        const title=it.querySelector('.tl-title')?.textContent||'';
        t+='  '+time+' '+title+'\n';
      });
    });
    try{await navigator.clipboard.writeText(t);flash('✅ 文字已复制');}catch(e){flash('复制失败，请手动选择');}
  });
  document.getElementById('dlImg').addEventListener('click',async()=>{
    flash('生成中…');
    try{
      if(typeof html2canvas==='undefined'){await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';sc.onload=res;sc.onerror=rej;document.head.appendChild(sc);});}
      mask.classList.remove('open');
      await new Promise(r=>setTimeout(r,250));
      const canvas=await html2canvas(document.body,{scale:2,backgroundColor:getComputedStyle(document.body).backgroundColor,useCORS:true,scrollY:-window.scrollY});
      const a=document.createElement('a');a.download='议程-'+Date.now()+'.png';a.href=canvas.toDataURL('image/png');a.click();
    }catch(e){console.error(e);flash('生成失败：'+e.message);}
  });
}
init();
</script>
</body>
</html>
