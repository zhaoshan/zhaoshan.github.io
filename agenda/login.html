<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 · 登录</title>
<style>
:root{--primary:#0a1628;--accent:#c9a96e;--bg:#f5f0e8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#0a1628,#1a2744);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff}
.card{background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid rgba(201,169,110,.25);border-radius:20px;padding:44px 40px;width:380px;max-width:90vw;box-shadow:0 24px 80px rgba(0,0,0,.4)}
.logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#d4af37);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 20px;box-shadow:0 8px 24px rgba(201,169,110,.4)}
h1{font-size:22px;font-weight:700;text-align:center;margin-bottom:6px}
.sub{font-size:13px;color:rgba(255,255,255,.5);text-align:center;margin-bottom:30px}
label{display:block;font-size:12px;color:rgba(255,255,255,.6);margin-bottom:8px;letter-spacing:.5px}
input{width:100%;padding:13px 16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:15px;outline:none;transition:.2s;font-family:inherit}
input:focus{border-color:var(--accent);background:rgba(255,255,255,.12);box-shadow:0 0 0 3px rgba(201,169,110,.2)}
button{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent),#d4af37);color:#0a1628;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:22px;transition:.2s;font-family:inherit}
button:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(201,169,110,.4)}
.err{color:#ff8a8a;font-size:13px;text-align:center;margin-top:14px;min-height:18px}
.hint{margin-top:24px;font-size:11px;color:rgba(255,255,255,.3);text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <div class="logo">📋</div>
  <h1>议程管理后台</h1>
  <p class="sub">客户拜访日程运营平台</p>
  <form id="loginForm">
    <label>管理密码</label>
    <input type="password" id="pwd" placeholder="请输入管理密码" autofocus required>
    <button type="submit">进入后台</button>
    <div class="err" id="err"></div>
  </form>
  <div class="hint">默认密码：admin123（可在后台设置中修改）</div>
</div>
<script src="assets/app.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const pwd = document.getElementById('pwd').value;
  const data = await AgendaApp.getData();
  const correct = (data.settings||{}).admin_password || 'admin123';
  if(pwd === correct){
    sessionStorage.setItem('admin_logged_in','1');
    window.location.href='admin.html';
  }else{
    document.getElementById('err').textContent='密码错误，请重试';
  }
});
if(sessionStorage.getItem('admin_logged_in')==='1'){window.location.href='admin.html';}
</script>
</body>
</html>
